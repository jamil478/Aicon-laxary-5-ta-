<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --obsidian: #080808;
            --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-shadow: rgba(179, 135, 40, 0.4);
            --glass: rgba(15, 15, 15, 0.85);
        }

        body {
            margin: 0; background: #020202;
            height: 100vh; display: flex; flex-direction: column;
            justify-content: flex-end; align-items: center;
            padding-bottom: 50px; overflow: hidden;
            /* ২০২৬ লাক্সারি ব্যাকগ্রাউন্ড: হালকা গোল্ডেন ডাস্ট */
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        /* লাক্সারি ডক কন্টেইনার */
        .luxury-dock {
            display: flex; gap: 20px; padding: 15px 30px;
            background: var(--glass);
            backdrop-filter: blur(50px);
            border-radius: 40px;
            /* গোল্ডেন রিম লাইটিং */
            border: 1px solid rgba(191, 149, 63, 0.3);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), 
                        inset 0 0 20px rgba(191, 149, 63, 0.05);
            position: relative;
        }

        /* প্রিমিয়াম আইকন হোল্ডার */
        .luxury-item {
            width: 65px; height: 65px;
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border-radius: 22px;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer;
            position: relative;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            border: 1px solid rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }

        /* গোল্ডেন বর্ডার এনিমেশন অন হোভার */
        .luxury-item::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 22px; padding: 2px;
            background: var(--gold);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0; transition: 0.5s;
        }

        .luxury-item:hover {
            transform: translateY(-25px) rotateX(15deg);
            box-shadow: 0 20px 40px var(--gold-shadow);
        }

        .luxury-item:hover::before { opacity: 1; }

        /* একটিভ মার্কার: লিকুইড গোল্ড ড্রপ */
        .active-dot {
            position: absolute; bottom: -12px; width: 6px; height: 6px;
            background: var(--gold); border-radius: 50%;
            box-shadow: 0 0 15px #fcf6ba;
        }

        /* মাউস সরালে নিচে গোল্ডেন রিফ্লেকশন */
        .floor-reflection {
            position: absolute; bottom: -40px; width: 120%; height: 20px;
            background: var(--gold); filter: blur(40px); opacity: 0.1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="luxury-dock">
        <div class="floor-reflection"></div>
        
        <div class="luxury-item">
            <span style="filter: grayscale(1) brightness(1.5);">💎</span>
        </div>
        
        <div class="luxury-item">
            <span style="filter: grayscale(1) brightness(1.5);">⌚</span>
            <div class="active-dot"></div>
        </div>
        
        <div class="luxury-item">
            <span style="filter: grayscale(1) brightness(1.5);">🏰</span>
        </div>
        
        <div class="luxury-item">
            <span style="filter: grayscale(1) brightness(1.5);">🍷</span>
        </div>
        
        <div class="luxury-item">
            <span style="filter: grayscale(1) brightness(1.5);">💰</span>
        </div>
    </div>

    <div style="margin-top: 30px; color: #555; font-family: 'Times New Roman', serif; letter-spacing: 8px; font-size: 11px; font-style: italic;">
        ESTATE OF EXCELLENCE • 2026
    </div>

</body>
</html>
